name: Build & Sign MSIX (multi-arch)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            appx_arch: x64
            py_arch: x64
            runner: windows-latest
          - arch: x86
            appx_arch: x86
            py_arch: x86
            runner: windows-latest
          - arch: arm64
            appx_arch: arm64
            py_arch: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (${{ matrix.py_arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build native exe with PyInstaller
        run: pyinstaller zombieslayer.spec --noconfirm --clean

      - name: Assemble MSIX payload folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "payload/Assets" | Out-Null
          Copy-Item "dist/ZombieSlayer.exe" "payload/ZombieSlayer.exe"
          Copy-Item "packaging/Assets/*" "payload/Assets/" -Recurse
          (Get-Content "packaging/Package.appxmanifest.template") `
            -replace "__ARCH__", "${{ matrix.appx_arch }}" |
            Set-Content "payload/AppxManifest.xml"

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $latest = Get-ChildItem $kitsRoot | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending | Select-Object -First 1
          $toolArch = if ("${{ matrix.runner }}" -eq "windows-11-arm") { "arm64" } else { "x64" }
          $toolDir = Join-Path $latest.FullName $toolArch
          echo "toolDir=$toolDir" >> $env:GITHUB_OUTPUT

      - name: Pack .msix for ${{ matrix.arch }}
        shell: pwsh
        run: |
          $makeappx = Join-Path "${{ steps.sdk.outputs.toolDir }}" "makeappx.exe"
          & $makeappx pack /d payload /p "ZombieSlayer-${{ matrix.arch }}.msix" /overwrite

      - name: Upload per-arch package
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: ZombieSlayer-${{ matrix.arch }}.msix

  bundle-and-sign:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download all per-arch packages
        uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: bundle-input
          merge-multiple: true

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $latest = Get-ChildItem $kitsRoot | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending | Select-Object -First 1
          $toolDir = Join-Path $latest.FullName "x64"
          echo "toolDir=$toolDir" >> $env:GITHUB_OUTPUT

      - name: Build .appxbundle from the three .msix packages
        shell: pwsh
        run: |
          $makeappx = Join-Path "${{ steps.sdk.outputs.toolDir }}" "makeappx.exe"
          & $makeappx bundle /d bundle-input /p ZombieSlayer.appxbundle /overwrite

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CSC_LINK }}")
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)

      - name: Sign the bundle
        shell: pwsh
        run: |
          $signtool = Join-Path "${{ steps.sdk.outputs.toolDir }}" "signtool.exe"
          & $signtool sign /fd SHA256 /a /f cert.pfx /p "${{ secrets.CSC_KEY_PASSWORD }}" ZombieSlayer.appxbundle

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force cert.pfx -ErrorAction SilentlyContinue

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZombieSlayer-appxbundle
          path: ZombieSlayer.appxbundle

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZombieSlayer.appxbundle
