name: Build ZombieSlayer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ZombieSlayer-windows
            build_path: dist/ZombieSlayer.exe
          - os: macos-latest
            artifact_name: ZombieSlayer-macos
            build_path: dist/ZombieSlayer.app
          - os: ubuntu-latest
            artifact_name: ZombieSlayer-linux
            build_path: dist/ZombieSlayer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux GUI/X11 build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller zombieslayer.spec --noconfirm --clean

      - name: Package macOS .app as a zip
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ZombieSlayer-macos.zip ZombieSlayer.app

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/ZombieSlayer.exe

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/ZombieSlayer

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/ZombieSlayer-macos.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ZombieSlayer-windows/ZombieSlayer.exe
            artifacts/ZombieSlayer-linux/ZombieSlayer
            artifacts/ZombieSlayer-macos/ZombieSlayer-macos.zip
